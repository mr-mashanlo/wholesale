services:

  db:
    image: postgres:15
    container_name: postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - postgres-network
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: node
    restart: always
    build:
      context: ./server
      dockerfile: dockerfile.production
    ports:
      - "9173:9173"
    networks:
      - postgres-network
    depends_on:
      db:
        condition: service_healthy

  client:
    container_name: react
    restart: always
    build:
      context: ./client
      dockerfile: dockerfile.production
    networks:
      - postgres-network
    ports:
      - "5173:80"
    depends_on:
      - server

networks:
  postgres-network:

volumes:
  postgres:
