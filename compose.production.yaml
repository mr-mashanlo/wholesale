services:

  db:
    image: postgres:15
    container_name: postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - postgres-network
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: node
    restart: always
    build:
      context: ./server
      dockerfile: dockerfile.production
    ports:
      - "9173:9173"
    networks:
      - postgres-network
    depends_on:
      db:
        condition: service_healthy

networks:
  postgres-network:

volumes:
  postgres:
