services:

  db:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - postgres-network
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: node
    restart: unless-stopped
    build:
      context: ./server
      dockerfile: dockerfile
    ports:
      - "9173:9173"
    networks:
      - postgres-network
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  client:
    container_name: react
    restart: unless-stopped
    build:
      context: ./client
      dockerfile: dockerfile
    ports:
      - "5173:5173"
    networks:
      - postgres-network
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules

networks:
  postgres-network:

volumes:
  postgres:
